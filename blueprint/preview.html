ote:&#x27;Authored sample interaction · answers do not update a learner profile.&#x27;,definition:&#x27;A list of vectors is linearly independent when the only way to combine it into the zero vector is to use all-zero coefficients.&#x27;,definitionLead:&#x27;The word “only” matters.&#x27;,intro:&#x27;Two different arrows can still describe the same direction. Independence asks whether any vector is redundant in the combinations you can make.&#x27;,explain:&#x27;Let u = (1, 0) and v = (1, t). When t ≠ 0, setting both coordinates to zero forces b = 0 and then a = 0.&#x27;,misconception:&#x27;Different vectors can be dependent. At t = 0, u and v coincide, and 1u − 1v = 0 is a nontrivial relation.&#x27;,exampleLead:&#x27;Use coordinates to prove what the picture suggests.&#x27;,exampleText:&#x27;For u = (1, 2) and w = (3, 1), suppose au + bw = 0. Comparing coordinates gives two equations.&#x27;,exampleFinish:&#x27;Twice the first equation minus the second gives 5b = 0. Therefore b = 0 and a = 0: the pair is independent over the real numbers.&#x27;,exampleNote:&#x27;Testing several coefficient pairs is not a proof. Solving the equations accounts for every pair.&#x27;,practiceLead:&#x27;Use u = (1, 0) and v = (1, t). You can change t in the diagram before answering.&#x27;,objectiveSpecial:&#x27;Tell whether a vector adds a new direction, and justify the answer with a zero-combination equation.&#x27;,specialTitle:&#x27;A new direction, or more of the same?&#x27;,emptyEntry:&#x27;Start with a short placement check.&#x27;},
