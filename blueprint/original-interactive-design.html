  <script type="application/json" id="lt-curriculum-data">{"groups":[{"id":"F","en":"Foundations","zh":"通用基础"},{"id":"M","en":"Mathematics","zh":"数学"},{"id":"P","en":"Physics","zh":"物理"},{"id":"C","en":"Chemistry","zh":"化学"},{"id":"B","en":"Biology","zh":"生物学"},{"id":"S","en":"Computer science & OI","zh":"计算机科学与信息学竞赛"},{"id":"X","en":"Connections & projects","zh":"学科交叉与项目"}],"courses":[{"id":"F01","group":"F","en":"Mathematical language & numerical fluency","zh":"数学语言与数感","requires":[],"modules":["Numbers, fractions and ratios","Algebraic notation and expressions","Sets, functions and mappings","Logic, quantifiers and negation","Graphs, scales and estimation","Mathematical communication"],"exit":"Translate a verbal constraint into symbols, test examples, and explain the domain."},{"id":"F02","group":"F","en":"Proof & problem-solving methods","zh":"证明与解题方法","requires":["F01"],"modules":["Claims, definitions and counterexamples","Direct proof and equivalence","Contrapositive and contradiction","Mathematical induction","Invariants and extremal arguments","Writing and checking a proof"],"exit":"Produce a complete proof and diagnose a plausible but invalid proof."},{"id":"F03","group":"F","en":"Measurement & scientific inquiry","zh":"测量与科学探究","requires":["F01"],"modules":["SI units and dimensional analysis","Measurement and uncertainty","Graphs and data interpretation","Hypotheses, controls and confounding","Models, fitting and residuals","Reproducible laboratory records"],"exit":"Design a controlled investigation, propagate simple uncertainty, and state model limits."},{"id":"F04","group":"F","en":"Learning & scientific communication","zh":"学习方法与科学表达","requires":[],"modules":["Retrieval and self-explanation","Worked examples and deliberate practice","Error logs and revision","Reading scientific text","Bilingual terminology and notation","Planning and presenting an investigation"],"exit":"Explain a concept in both languages and construct a review plan from actual errors."},{"id":"M01","group":"M","en":"Algebra & functions","zh":"代数与函数","requires":["F01"],"modules":["Expressions, equations and inequalities","Linear and quadratic functions","Polynomials and rational functions","Exponential and logarithmic functions","Composition and inverse functions","Parameters and functional modeling"],"exit":"Solve a parameterized problem while tracking domain restrictions and extraneous roots."},{"id":"M02","group":"M","en":"Trigonometry","zh":"三角学","requires":["M01"],"modules":["Angles, radians and the unit circle","Sine, cosine and tangent","Identities and transformations","Trigonometric equations","Triangle laws and applications","Oscillations and inverse trigonometric functions"],"exit":"Derive an identity and solve a geometry or oscillation problem with correct angle domains."},{"id":"M03","group":"M","en":"Euclidean geometry","zh":"欧几里得几何","requires":["M01","F02"],"modules":["Axioms, congruence and similarity","Triangles and special centers","Circles and cyclic quadrilaterals","Area, ratios and geometric inequalities","Transformations and constructions","Solid geometry and spatial reasoning"],"exit":"Write a synthetic proof with explicit incidence and nondegeneracy assumptions."},{"id":"M04","group":"M","en":"Coordinate geometry & vectors","zh":"解析几何与向量","requires":["M01"],"modules":["Cartesian coordinates and distance","Lines, planes and intersections","Vector addition and scalar products","Conic sections","Parametric and polar representations","Three-dimensional vectors and cross products"],"exit":"Translate a geometric constraint into equations and interpret every solution geometrically."},{"id":"M05","group":"M","en":"Complex numbers & polynomials","zh":"复数与多项式","requires":["M01","M02"],"modules":["Complex arithmetic and the plane","Polar form and roots of unity","Polynomial division and factorization","Vieta relations and root structure","Interpolation and polynomial identities","Complex-number geometry"],"exit":"Solve a polynomial or geometry problem using roots of unity and justify multiplicities."},{"id":"M06","group":"M","en":"Sequences & recurrence relations","zh":"数列与递推","requires":["M01","F02"],"modules":["Arithmetic and geometric sequences","Summation and telescoping","First-order recurrences","Linear recurrences and characteristic roots","Generating-function introduction","Bounds and asymptotic growth"],"exit":"Derive and verify a recurrence, initial conditions, and a closed form or asymptotic bound."},{"id":"M07","group":"M","en":"Calculus I: limits & derivatives","zh":"微积分一：极限与导数","requires":["M01","M02"],"modules":["Limits and continuity","Derivative as a local rate","Differentiation rules","Mean value theorem and shape","Optimization and related rates","Local approximation and error"],"exit":"Derive a derivative from its definition and solve an optimization problem with boundary checks."},{"id":"M08","group":"M","en":"Calculus II: integration & series","zh":"微积分二：积分与级数","requires":["M07","M06"],"modules":["Riemann sums and definite integrals","Fundamental theorem of calculus","Integration techniques","Improper integrals and applications","Infinite series and convergence","Power series and Taylor approximation"],"exit":"Choose and justify an integration or convergence method and bound an approximation error."},{"id":"M09","group":"M","en":"Linear algebra I","zh":"线性代数一","requires":["M01","M04","F02"],"modules":["Linear systems and elimination","Vectors, span and independence","Vector spaces, bases and dimension","Linear maps and matrices","Determinants and invertibility","Eigenvalues and diagonalization"],"exit":"Explain a transformation geometrically, solve its system, and justify rank and dimension claims."},{"id":"M10","group":"M","en":"Linear algebra II","zh":"线性代数二","requires":["M09"],"modules":["Inner products and orthogonality","Least squares and projections","Spectral theorem","Singular value decomposition","Quadratic forms and definiteness","Canonical forms and applications"       P01:['一维运动学','二维与三维运动','牛顿定律与受力分析','接触力与摩擦力','圆周运动与约束','参考系与模型检验'],
      C03:['焓与盖斯定律','熵与吉布斯能','平衡常数与反应商','酸、碱与缓冲溶液','溶解与配位平衡','耦合平衡与近似检验'],
      B02:['孟德尔遗传','概率基础与家系推理','连锁、重组与遗传图谱','染色体变异','数量与群体遗传学','遗传实验与推断'],
      S05:['状态、转移与边界','序列与网格动态规划','背包与资源分配','区间、树与 DAG 动态规划','状压、数位与计数 DP','优化与方案还原'],
      X01:['可复现的计算记录','数值模型验证','微分方程与物理仿真','蒙特卡洛与不确定性','生物与化学数据模型','可复现的仿真项目']
    };
    const words={
      en:{map:'Learning map',lesson:'Lesson studio',offline:'Designed for offline study',preview:'Design preview',subjects:'Your curriculum',eyebrow:'A route through the ideas',course:'Choose a course',planned:'6 planned modules',module:'MODULE',selected:'Selected module',previewTag:'Curriculum proposal',entry:'Readiness connections',entryNote:'Placement checks let you skip knowledge you can already demonstrate.',outcome:'Course exit task',sample:'Preview a lesson',links:'Where these ideas connect',note:'Planned curriculum · no personal progress is shown.',fallback:'Module translation pending · English preview',lessonPath:'Mathematics / Linear algebra I',lessonEyebrow:'LESSON SPECIMEN · 02',lessonTitle:'When does a vector add a new direction?',lessonSub:'Linear independence, explained through a definition, a picture, and a proof.',concept:'Concept',example:'Worked example',practice:'Try it',lab:'Explore the span',parameter:'Vector height t',independent:'Independent · spans the plane',dependent:'Dependent · spans one line',labNote:'The picture illustrates the claim. The algebra establishes it.',next:'Worked example',try:'Try a question',back:'Back to route',check:'Check answer',practiceTitle:'Which values of t make this pair independent?',choose:'Choose an answer before checking.',correct:'Correct. If t ≠ 0, bt = 0 forces b = 0, then a + b = 0 forces a = 0. Only the trivial solution remains.',incorrect:'Start with the second coordinate: bt = 0. When t = 0, the nonzero coefficients a = 1 and b = −1 already give the zero vector. Try the other case.',all:'Every real value of t',specimenNote:'Authored sample interaction · answers do not update a learner profile.',definition:'A list of vectors is linearly independent when the only way to combine it into the zero vector is to use all-zero coefficients.',definitionLead:'The word “only” matters.',intro:'Two different arrows can still describe the same direction. Independence asks whether any vector is redundant in the combinations you can make.',explain:'Let u = (1, 0) and v = (1, t). When t ≠ 0, setting both coordinates to zero forces b = 0 and then a = 0.',misconception:'Different vectors can be dependent. At t = 0, u and v coincide, and 1u − 1v = 0 is a nontrivial relation.',exampleLead:'Use coordinates to prove what the picture suggests.',exampleText:'For u = (1, 2) and w = (3, 1), suppose au + bw = 0. Comparing coordinates gives two equations.',exampleFinish:'Twice the first equation minus the second gives 5b = 0. Therefore b = 0 and a = 0: the pair is independent over the real numbers.',exampleNote:'Testing several coefficient pairs is not a proof. Solving the equations accounts for every pair.',practiceLead:'Use u = (1, 0) and v = (1, t). You can change t in the diagram before answering.',objectiveSpecial:'Tell whether a vector adds a new direction, and justify the answer with a zero-combination equation.',specialTitle:'A new direction, or more of the same?',emptyEntry:'Start with a short placement check.'},
      zh:{map:'学习地图',lesson:'课程工作台',offline:'面向离线学习设计',preview:'设计预览',subjects:'你的课程体系',eyebrow:'沿着知识的联系前进',course:'选择课程',planned:'6 个规划模块',module:'模块',selected:'当前选择',previewTag:'课程蓝图',entry:'先修知识关联',entryNote:'通过诊断测验展示已有能力，即可跳过相应知识。',outcome:'课程验收目标',sample:'预览示范课程',links:'这些知识通向哪里',note:'课程规划预览 · 不代表你的个人进度。',fallback:'模块中文翻译待编写 · 当前显示英文',lessonPath:'数学 / 线性代数一',lessonEyebrow:'课程示范 · 02',lessonTitle:'一个向量何时带来新的方向？',lessonSub:'从定义、图像到证明，理解线性无关。',concept:'概念',example:'例题推导',practice:'动手练习',lab:'探索张成空间',parameter:'向量的纵坐标 t',independent:'线性无关 · 张成整个平面',dependent:'线性相关 · 仅张成一条直线',labNote:'图像帮助观察，代数推导负责证明。',next:'查看例题',try:'试做一道题',back:'返回路线',check:'检查答案',practiceTitle:'t 取哪些值时，这个向量组线性无关？',choose:'请先选择一个答案。',correct:'正确。当 t ≠ 0 时，bt = 0 推出 b = 0，再由 a + b = 0 得到 a = 0。因此只有零解。',incorrect:'先看第二个坐标 bt = 0。当 t = 0 时，取 a = 1、b = −1 就得到一组非零系数组合。再考虑另一种情况。',all:'任意实数 t',specimenNote:'预编写的示范交互 · 答案不会写入学习档案。',definition:'一个向量组线性无关，是指它的线性组合等于零向量时，所有系数只能全为零。',definitionLead:'“只有零解”中的“只有”不能省略。',intro:'两个不同的箭头也可能表示同一个方向。线性无关研究的是：在所有能形成的线性组合中，是否存在冗余的向量。',explain:'取 u = (1, 0)、v = (1, t)。当 t ≠ 0 时，令两个坐标都等于零，先得到 b = 0，再得到 a = 0。',misconception:'不同的向量也可能线性相关。t = 0 时，u 与 v 重合，1u − 1v = 0 就是一个非平凡关系。',exampleLead:'用坐标推导，证明图像所提示的结论。',exampleText:'取 u = (1, 2)、w = (3, 1)，设 au + bw = 0。分别比较两个坐标，得到两个方程。',exampleFinish:'第一个方程的两倍减去第二个方程，得到 5b = 0，所以 b = 0，进而 a = 0。这个向量组在实数域上线性无关。',exampleNote:'只尝试几组系数不能构成证明。解出方程的全部解，才能覆盖所有情况。',practiceLead:'取 u = (1, 0)、v = (1, t)。可以先在图中改变 t，再作答。',objectiveSpecial:'判断一个向量是否增加了新的方向，并用零向量的线性组合方程解释原因。',specialTitle:'新的方向，还是原方向的延伸？',emptyEntry:'从一次简短的诊断测验开始。'}
    };
    let state={lang:'en',course:'M09',module:1,view:'map',stage:'concept',t:1,answer:'',feedback:''};
    const design={layout:'Study studio',motion:true,radius:18};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tr=k=>words[state.lang][k]||k;
    const title=c=>state.lang==='zh'?c.zh:c.en;
    const modTitle=(c,i)=>state.lang==='zh'&&moduleZh[c.id]?moduleZh[c.id][i]:c.modules[i];
    function restore(value){
      const m=value?.modelContent||{},p=value?.privateContent||{};
      if(['en','zh'].includes(m.language))state.lang=m.language;
      if(courses.some(c=>c.id===m.course))state.course=m.course;
      if(Number.isInteger(m.module)&&m.module>=0&&m.module<6)state.module=m.module;
      if(['map','lesson'].includes(m.view))state.view=m.view;
      if(['concept','example','practice'].includes(m.stage))state.stage=m.stage;
      if(Number.isFinite(m.t)&&m.t>=-2&&m.t<=2)state.t=m.t;
      if(['zero','nonzero','all',''].includes(p.answer))state.answer=p.answer;
      if(['correct','incorrect','choose',''].includes(p.feedback))state.feedback=p.feedback;
    }
    function save(){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{language:state.lang,course:state.course,module:state.module,view:state.view,stage:state.stage,t:state.t},privateContent:{answer:state.answer,feedback:state.feedback}}).catch(()=>{});
    }
    restore(window.openai?.widgetState);
    function animate(){if(design.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches)main.animate([{opacity:.55,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'});}
    function icon(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
    function renderChrome(){
      root.lang=state.lang==='zh'?'zh-CN':'en';
      root.setAttribute('aria-label',state.lang==='zh'?'知序学习平台设计预览':'Lattice learning platform design preview');
      root.querySelector('#lt-preview-label').textContent=tr('preview');
      root.querySelector('#lt-language').textContent=state.lang==='en'?'中文':'English';
      root.querySelector('#lt-language').setAttribute('aria-label',state.lang==='zh'?'切换界面与示范课程语言':'Switch interface and specimen language');
      root.querySelector('.lt-sidebar').setAttribute('aria-label',state.lang==='zh'?'学习导航':'Learning navigation');
      root.querySelector('.lt-sidebar nav').setAttribute('aria-label',state.lang==='zh'?'工作区':'Workspace');
      root.querySelector('#lt-subjects').setAttribute('aria-label',state.lang==='zh'?'学科':'Subjects');
      root.querySelector('#lt-subject-label').textContent=tr('subjects');
      root.querySelectorAll('[data-label]').forEach(e=>e.textContent=tr(e.dataset.label));
      root.querySelectorAll('[data-view]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.view===state.view));
      root.querySelector('#lt-subjects').innerHTML=data.groups.map(g=>`<button type="button" class="lt-subject cursor-interaction" data-subject="${g.id}" aria-pressed="${getCourse(state.course).group===g.id}"><span class="lt-subject-mark" aria-hidden="true"></span><span>${esc(groupShort[state.lang][g.id])}</span></button>`).join('');
    }
    function links(ids){return ids.map(id=>{const c=getCourse(id);return `<button type="button" class="cursor-interaction" data-course="${id}">${esc(title(c))}</button>`;}).join('');}
    function renderMap(){
      const c=getCourse(state.course),special=c.id==='M09'&&state.module===1;
      const related=data.connections.filter(x=>x[0]===c.id||x[1]===c.id).map(x=>x[0]===c.id?x[1]:x[0]);
      main.innerHTML=`<div class="lt-breadcrumb"><span>${esc(groupShort[state.lang][c.group])}</span><span>/</span><span>${esc(c.id)}</span><span class="lt-grow"></span><span class="lt-tag">${tr('previewTag')}</span></div>
      <div class="lt-eyebrow">${tr('eyebrow')}</div><h1>${esc(title(c))}</h1>
      <p class="lt-subtitle">${state.lang==='en'?'Build the ideas in order. Follow the connections when you are ready.':'循序理解每个概念，在准备好时走向相邻学科。'}</p>
      <div class="lt-toolbar"><div class="lt-picker"><label for="lt-course-select">${tr('course')}</label><select id="lt-course-select" class="lt-course-select" aria-label="${tr('course')}">${courses.filter(x=>x.group===c.group).map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.id+' · '+title(x))}</option>`).join('')}</select></div><span class="lt-tag">${tr('planned')}</span></div>
      <div class="lt-map-layout"><div class="lt-route" aria-label="${tr('map')}">${c.modules.map((m,i)=>`<button type="button" class="lt-node cursor-interaction" data-module="${i}" aria-pressed="${i===state.module}"><span class="lt-node-num">${String(i+1).padStart(2,'0')}</span><span><span class="lt-node-title">${esc(modTitle(c,i))}</span><span class="lt-node-hint">${i===state.module?tr('selected'):c.id+'.'+String(i+1).padStart(2,'0')}</span></span></button>`).join('')}</div>
      <section class="lt-detail" aria-label="${tr('selected')}"><div class="lt-eyebrow">${tr('module')} ${String(state.module+1).padStart(2,'0')}</div><h2>${esc(special?tr('specialTitle'):modTitle(c,state.module))}</h2><p>${esc(special?tr('objectiveSpecial'):(state.lang==='en'?c.exit:'此模块的概念、例题与练习将在课程编写阶段完成。'))}</p><hr><h3>${tr('entry')}</h3><p>${tr('entryNote')}</p><div class="lt-related">${c.requires.length?links(c.requires):`<span class="lt-caption">${tr('emptyEntry')}</span>`}</div><button type="button" class="lt-primary cursor-interaction" data-open-lesson>${tr('sample')}<i data-lucide="arrow-right" aria-hidden="true"></i></button></section></div>
      ${related.length?`<section class="lt-connections"><h3>${tr('links')}</h3><div class="lt-related">${links(related)}</div></section>`:''}
      <div class="lt-preview-note"><i data-lucide="info" aria-hidden="true"></i><span>${state.lang==='zh'&&!moduleZh[c.id]?tr('fallback')+' · ':''}${tr('note')}</span></div>`;
    }
    function lab(){return `<aside class="lt-lab" aria-label="${tr('lab')}"><h3>${tr('lab')}</h3><div class="lt-caption">u = (1, 0) · v = (1, t)</div><div id="lt-plot"></div><label class="lt-control-label" for="lt-t"><span>${tr('parameter')}</span><output id="lt-t-value" for="lt-t"></output></label><input class="cursor-interaction" id="lt-t" type="range" min="-2" max="2" step="0.25" value="${state.t}" aria-label="${tr('parameter')}"><div id="lt-plane-state" class="lt-plane-state" aria-live="polite"></div><p class="lt-lab-note">${tr('labNote')}</p></aside>`;}
    function renderLesson(){
      const stages=['concept','example','practice'];
      let content='';
      if(state.stage==='concept')content=`<h2>${tr('definitionLead')}</h2><p>${tr('intro')}</p><div class="lt-definition"><strong>${tr('definition')}</strong></div><div class="lt-equation">a₁v₁ + ··· + aₖvₖ = 0</div><p>${tr('explain')}</p><div class="lt-equation">a(1, 0) + b(1, t) = (a + b, bt)</div><p class="lt-misconception">${tr('misconception')}</p>`;
      if(state.stage==='example')content=`<h2>${tr('exampleLead')}</h2><p>${tr('exampleText')}</p><div class="lt-equation">a + 3b = 0<br>2a + b = 0</div><p>${tr('exampleFinish')}</p><p class="lt-misconception">${tr('exampleNote')}</p>`;
      if(state.stage==='practice')content=`<h2>${tr('practiceTitle')}</h2><p>${tr('practiceLead')}</p><div class="lt-choices" role="group" aria-label="${tr('practiceTitle')}">${[['zero','t = 0'],['nonzero','t ≠ 0'],['all',tr('all')]].map(([id,label])=>`<label class="lt-choice cursor-interaction"><input type="radio" name="lt-answer" value="${id}" ${state.answer===id?'checked':''}><span>${label}</span></label>`).join('')}</div><button type="button" class="lt-primary cursor-interaction" id="lt-check">${tr('check')}</button><div class="lt-feedback" id="lt-feedback" aria-live="polite">${state.feedback?tr(state.feedback):''}</div>`;
      main.innerHTML=`<div class="lt-breadcrumb"><span>${tr('lessonPath')}</span><span class="lt-grow"></span><span class="lt-tag">${tr('previewTag')}</span></div><div class="lt-eyebrow">${tr('lessonEyebrow')}</div><h1>${tr('lessonTitle')}</h1><p class="lt-subtitle">${tr('lessonSub')}</p><div class="lt-lesson-top"><div class="lt-lesson-tabs" aria-label="${tr('lesson')}">${stages.map(s=>`<button type="button" class="cursor-interaction" data-stage="${s}" aria-pressed="${state.stage===s}">${tr(s)}</button>`).join('')}</div><span class="lt-caption">u = (1, 0) · v = (1, t)</span></div><div class="lt-lesson-layout"><article class="lt-reading">${content}</article>${lab()}</div><div class="lt-footer-actions"><button type="button" class="cursor-interaction" data-view="map">← ${tr('back')}</button><span class="lt-grow"></span>${state.stage!=='practice'?`<button type="button" class="lt-primary cursor-interaction" data-stage="${state.stage==='concept'?'example':'practice'}">${state.stage==='concept'?tr('next'):tr('try')} →</button>`:''}</div><div class="lt-preview-note"><i data-lucide="info" aria-hidden="true"></i><span>${tr('specimenNote')}</span></div>`;
      drawPlot();
    }
    function drawPlot(){
      const box=root.querySelector('#lt-plot');if(!box)return;
      const t=state.t,ox=56,oy=116,scale=42,x=ox+scale,y=oy-t*scale;
      const independent=t!==0;
      const desc=state.lang==='en'?`Vectors (1,0) and (1,${t}). ${independent?'They span the plane.':'They span a line.'}`:`向量 (1,0) 与 (1,${t})，${independent?'张成整个平面':'仅张成一条直线'}。`;
      box.innerHTML=`<svg class="lt-vector-plot" viewBox="0 0 238 230" role="img" aria-label="${esc(desc)}"><title>${esc(desc)}</title><defs><marker id="lt-arrow-u" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="var(--lt-text)"/></marker><marker id="lt-arrow-v" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="var(--lt-accent)"/></marker></defs><rect x="14" y="13" width="211" height="207" rx="7" fill="${independent?'var(--lt-soft)':'var(--lt-panel)'}"/>${[14,56,98,140,182,224].map(v=>`<line x1="${v}" y1="13" x2="${v}" y2="220" stroke="var(--lt-grid)"/>`).join('')}${[32,74,116,158,200].map(v=>`<line x1="14" y1="${v}" x2="225" y2="${v}" stroke="var(--lt-grid)"/>`).join('')}<line x1="14" y1="116" x2="225" y2="116" stroke="var(--lt-muted)" stroke-width="1"/><line x1="56" y1="220" x2="56" y2="13" stroke="var(--lt-muted)" stroke-width="1"/>${!independent?'<line x1="14" y1="116" x2="225" y2="116" stroke="var(--lt-accent)" stroke-width="5" opacity=".2"/>':''}<line x1="${ox}" y1="${oy}" x2="${x}" y2="${oy}" stroke="var(--lt-text)" stroke-width="2.5" marker-end="url(#lt-arrow-u)"/><line x1="${ox}" y1="${oy}" x2="${x}" y2="${y}" stroke="var(--lt-accent)" stroke-width="2.5" marker-end="url(#lt-arrow-v)"/><circle cx="56" cy="116" r="3" fill="var(--lt-text)"/><text x="${x+9}" y="${oy+19}" fill="var(--lt-text)" font-size="13">u</text><text x="${x+9}" y="${y-9}" fill="var(--lt-accent)" font-size="13">v</text><text x="214" y="109" fill="var(--lt-muted)" font-size="12">x</text><text x="63" y="25" fill="var(--lt-muted)" font-size="12">y</text><text x="43" y="132" fill="var(--lt-muted)" font-size="12">0</text></svg>`;
      root.querySelector('#lt-t-value').textContent=`${t.toFixed(2).replace(/\.00$/,'')}`;
      root.querySelector('#lt-plane-state').textContent=tr(independent?'independent':'dependent');
    }
    function render(change=false){renderChrome();state.view==='lesson'?renderLesson():renderMap();icon();if(change)animate();}
    function chooseCourse(id){state.course=id;state.module=id==='M09'?1:0;state.view='map';render(true);save();}
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='lt-language'){state.lang=state.lang==='en'?'zh':'en';render(true);save();return;}
      if(b.dataset.subject){chooseCourse(defaults[b.dataset.subject]);return;}
      if(b.dataset.course){chooseCourse(b.dataset.course);return;}
      if(b.hasAttribute('data-module')){state.module=Number(b.dataset.module);render(true);root.querySelector(`[data-module="${state.module}"]`)?.focus({preventScroll:true});save();return;}
      if(b.dataset.view){state.view=b.dataset.view;if(state.view==='lesson'){state.course='M09';state.module=1;}render(true);save();return;}
      if(b.hasAttribute('data-open-lesson')){state.course='M09';state.module=1;state.view='lesson';state.stage='concept';render(true);save();return;}
      if(b.dataset.stage){state.stage=b.dataset.stage;render(true);root.querySelector(`[data-stage="${state.stage}"]`)?.focus({preventScroll:true});save();return;}
      if(b.id==='lt-check'){state.feedback=!state.answer?'choose':state.answer==='nonzero'?'correct':'incorrect';root.querySelector('#lt-feedback').textContent=tr(state.feedback);save();}
    });
    root.addEventListener('change',e=>{
      if(e.target.id==='lt-course-select')chooseCourse(e.target.value);
      if(e.target.name==='lt-answer'){state.answer=e.target.value;state.feedback='';root.querySelector('#lt-feedback').textContent='';save();}
      if(e.target.id==='lt-t')save();
    });
    root.addEventListener('input',e=>{if(e.target.id==='lt-t'){state.t=Number(e.target.value);drawPlot();}});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    function applyDesign(){root.classList.toggle('lt-reading-focus',design.layout==='Reading focus');root.classList.toggle('lt-no-motion',!design.motion);root.style.borderRadius=design.radius+'px';}
    render();applyDesign();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'layout',{label:'Workspace layout',options:['Study studio','Reading focus']});tweak.addToggle(design,'motion',{label:'Interface motion'});tweak.addSlider(design,'radius',{label:'Window corner radius',min:8,max:24,unit:'px'});}
  })();
  </script>
</div>
